# Render cron jobs are not free, so GitHub Actions runs the nightly batch directly against Supabase
# (no cold start, no 100-second request limit). Repo secrets needed: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
name: Nightly predictions

on:
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
  workflow_dispatch:

jobs:
  batch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analytics/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-offline.txt
      - run: python -m offline.nightly_batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
