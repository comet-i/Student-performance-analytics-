# Run all CLI commands from the parent folder (database/), not from inside supabase/.
# Hosted-project auth settings are NOT applied by `db push`; use `supabase config push`
# or mirror these in Dashboard -> Authentication.
project_id = "student-analytics"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15   # needs PG15+ (ON DELETE SET NULL (column) is used)

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local mail catcher: OTP emails show up at http://127.0.0.1:54324
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true      # users must verify email (OTP) before logging in
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"            # resend cooldown
otp_length = 6
otp_expiry = 600                 # seconds (10 min)

